name: 更新直播源

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 转换 M3U
        run: python3 convert_m3u.py https://live.445569.xyz/live.m3u live.json

      - name: 提交变更
        run: |
          if git diff --quiet live.json; then
            echo "无变更"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live.json
          git commit -m "chore: 自动更新直播源配置（$(TZ=Asia/Shanghai date +%Y-%m-%d)）"
          git push
